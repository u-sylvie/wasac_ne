<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bill Notification</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333;">
<h2>{{appName}} — Utility Bill</h2>
<p>Hello {{firstName}},</p>
<p>Your utility bill <strong>{{billReference}}</strong> for {{billingMonth}}/{{billingYear}}
    has been generated.</p>
<p>Total amount due: <strong>{{totalAmount}} FRW</strong></p>
<p>Please log in to your account to view details and make a payment.</p>
<p>Thank you,<br>{{appName}} Team</p>
</body>
</html>
