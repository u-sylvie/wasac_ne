<!DOCTYPE html>
<html lang="en">
<body style="font-family: Arial, sans-serif; color: #333; max-width: 600px; margin: auto; padding: 24px;">

  <h2 style="color: #4F46E5;">Your {{appName}} verification code</h2>

  <p>Hi {{firstName}},</p>

  <p>Use the following one-time password to {{purposeLabel}}:</p>

  <p style="font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #4F46E5; margin: 24px 0;">
    {{otpCode}}
  </p>

  <p style="color: #666;">This code expires in <strong>{{expiryMinutes}} minutes</strong>.</p>

  <hr style="border: none; border-top: 1px solid #eee; margin: 32px 0;"/>

  <p style="font-size:12px; color:#999;">
    If you did not request this code, you can safely ignore this email.
  </p>

</body>
</html>
