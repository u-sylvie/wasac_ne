<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Payment Notification</title>
</head>
<body style="font-family: Arial, sans-serif; color: #333;">
<h2>{{appName}} — Payment Confirmation</h2>
<p>Hello {{firstName}},</p>
<p>We have received your payment for bill <strong>{{billReference}}</strong>.</p>
<p>Bill total: <strong>{{totalAmount}} FRW</strong></p>
<p>Your account balance for this bill is now settled. Thank you for your payment.</p>
<p>Regards,<br>{{appName}} Team</p>
</body>
</html>
